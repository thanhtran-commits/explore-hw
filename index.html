<title>EXPLORE Homework</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;700;800&family=Andika:wght@400;700&display=swap&subset=vietnamese">
<style>
/* Layout: one-screen app — top bar (progress) · stage (scene / game) · dock (caption + controls).
   Single light theme on purpose: the watercolour street art is drawn on light paper. */
:root{
  color-scheme: light;
  --paper:#f8f5ef;      /* page ground, same paper as the illustrations */
  --card:#ffffff;
  --ink:#3a2e29;        /* line-art brown */
  --ink-soft:#7a6a60;
  --line:#e7ddd0;
  --blue:#2f7fe0;       /* DOL template speaker / primary */
  --blue-deep:#1f5fb0;
  --sky:#e3f1fb;
  --tomato:#e5534b;     /* awning red — wrong state */
  --leaf:#3aa657;       /* correct state */
  --sun:#f6c445;        /* stars, Kim's shirt */
  --wood:#e8c38c;
  /* Grandstander: chunky hand-lettered display, like the cart signs.
     Andika: SIL typeface made for beginning readers (single-storey a and g); has Vietnamese. */
  --font-display:"Grandstander", "Andika", ui-rounded, system-ui, sans-serif;
  --font-body:"Andika", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:18px;
  --dock-h:auto;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
button:disabled{cursor:default}
img{max-width:100%;-webkit-user-drag:none;user-select:none}

/* bottom strip is reserved for Kim + her speech bubble, so she never covers controls */
#app{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:10px 78px;max-width:1180px;margin:0 auto}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:12px;min-height:44px}
.top .tag{font-family:var(--font-display);font-weight:700;font-size:15px;line-height:1;white-space:nowrap;
  background:var(--card);border:2px solid var(--line);padding:8px 12px;border-radius:999px}
.top .tag b{color:var(--blue)}
.progress{flex:1;display:flex;gap:6px;min-width:0}
.progress i{flex:1;height:12px;border-radius:99px;background:#e9e2d7;position:relative;overflow:hidden}
.progress i.done{background:var(--leaf)}
.progress i.now{background:linear-gradient(90deg,var(--blue) 0 55%,#e9e2d7 55%)}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--card);border:2px solid var(--line);
  display:grid;place-items:center;font-size:20px;flex:none}
.iconbtn:active{transform:translateY(1px)}

/* ---------- main area ---------- */
main{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;position:relative}
.stagewrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.stage{position:relative;width:100%;aspect-ratio:16/9;max-height:100%;border-radius:var(--r);overflow:hidden;
  background:var(--card);box-shadow:0 2px 0 var(--line), 0 10px 30px rgba(58,46,41,.08)}
@supports (width: min(1px, 2px)){
  .stage{width:min(100%, calc((100dvh - var(--chrome, 250px)) * 16 / 9))}
}
.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .5s ease, transform .6s ease}
.scene.out{opacity:0}
.layer{position:absolute;inset:0}

/* counter of foods inside a cart scene */
.counter{position:absolute;left:12%;right:12%;bottom:5%;display:flex;justify-content:center;align-items:flex-end;gap:2%}
.food{position:relative;width:19%;display:flex;flex-direction:column;align-items:center;gap:2px;
  animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.food img{width:100%;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(58,46,41,.25))}
.food .lbl{font-family:var(--font-display);font-weight:800;font-size:clamp(12px,2.1vw,22px);line-height:1.1;
  background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:2px 10px;white-space:nowrap}
button.food:active img{transform:scale(.94)}
.food.heard .lbl{border-color:var(--leaf);color:#21753a}
.food.bounce img{animation:bounce .5s ease}

/* pointer ring for "look here" */
.ring{position:absolute;width:13%;aspect-ratio:1;border-radius:50%;border:5px solid var(--sun);
  box-shadow:0 0 0 6px rgba(246,196,69,.35);transform:translate(-50%,-50%);animation:ringpulse 1s ease-in-out infinite;pointer-events:none}
.ring::after{content:"";position:absolute;left:50%;top:-58%;width:0;height:0;transform:translateX(-50%);
  border-left:14px solid transparent;border-right:14px solid transparent;border-top:20px solid var(--sun);animation:arrow .6s ease-in-out infinite alternate}

/* cart hotspots in explore */
.hot{position:absolute;border-radius:16px;border:4px dashed rgba(47,127,224,.0);animation:hotpulse 1.6s ease-in-out infinite}
.hot .name{position:absolute;left:50%;bottom:-6px;transform:translate(-50%,100%);font-family:var(--font-display);font-weight:800;
  background:var(--blue);color:#fff;border-radius:999px;padding:3px 12px;font-size:clamp(12px,1.8vw,18px);white-space:nowrap;
  box-shadow:0 3px 0 var(--blue-deep)}
.hot.visited .name{background:var(--leaf);box-shadow:0 3px 0 #2a7d41}
.backbtn{position:absolute;left:10px;top:10px;font-family:var(--font-display);font-weight:800;font-size:clamp(13px,1.8vw,18px);
  background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:6px 14px}

/* ---------- dock (caption, controls) ---------- */
.dock{display:flex;flex-direction:column;gap:8px}
.caption{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:8px 10px;min-height:62px}
.caption .txt{flex:1;min-width:0;font-family:var(--font-display);font-weight:700;font-size:clamp(18px,3.2vw,28px);line-height:1.15}
.caption .txt mark{background:none;color:var(--blue)}
.speak{width:48px;height:48px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none;
  box-shadow:0 4px 0 var(--blue-deep)}
.speak svg{width:24px;height:24px}
.speak:active{transform:translateY(2px);box-shadow:0 2px 0 var(--blue-deep)}
.speak.big{width:76px;height:76px}
.speak.big svg{width:36px;height:36px}
.speak.playing{animation:speakpulse .8s ease-in-out infinite}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctl{height:44px;padding:0 14px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-weight:800;display:flex;align-items:center;gap:6px}
.ctl.primary{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-deep)}
.ctl.go{background:var(--leaf);border-color:var(--leaf);color:#fff;box-shadow:0 4px 0 #2a7d41}
.ctl:disabled{opacity:.45;box-shadow:none}
.spacer{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.chip{flex:none;font-weight:700;font-size:14px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:5px 10px;display:flex;gap:6px;align-items:center}
.chip.now{border-color:var(--blue);color:var(--blue-deep)}
.chip .s{width:16px;height:16px;color:var(--blue)}

/* heard tracker */
.tracker{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tracker span{width:38px;height:38px;border-radius:12px;background:var(--card);border:2px solid var(--line);display:grid;place-items:center}
.tracker img{width:30px;height:30px;object-fit:contain;filter:grayscale(1) opacity(.35)}
.tracker span.on{border-color:var(--leaf);background:#e2f4e7}
.tracker span.on img{filter:none}
.trackwrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.trackwrap .count{font-weight:800;font-size:14px;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- bubbles game ---------- */
.field{position:relative;flex:1;min-height:0;border-radius:var(--r);overflow:hidden;
  background:linear-gradient(#cfe9fb, #eaf6ff 60%, #f8fcff);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,3vh,28px);padding:14px}
.field::before,.field::after{content:"";position:absolute;background:#fff;border-radius:999px;opacity:.8}
.field::before{width:180px;height:44px;left:6%;top:12%;box-shadow:60px -18px 0 4px #fff}
.field::after{width:140px;height:36px;right:8%;top:22%;box-shadow:-50px -14px 0 2px #fff}
.rounds{display:flex;gap:6px;position:relative;z-index:1}
.rounds i{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #b9d7ee}
.rounds i.ok{background:var(--sun);border-color:#d9a21c}
.rounds i.try{background:#b9d7ee}
.rounds i.now{border-color:var(--blue);transform:scale(1.25)}
.bubbles{display:flex;gap:clamp(10px,4vw,48px);justify-content:center;align-items:center;position:relative;z-index:1;width:100%}
.bubble{--s:clamp(96px,27vw,200px);width:var(--s);height:var(--s);border-radius:50%;position:relative;
  background:radial-gradient(circle at 30% 28%, rgba(255,255,255,.95) 0 9%, rgba(255,255,255,.35) 10% 30%, rgba(160,210,245,.25) 55%, rgba(120,190,240,.55) 100%);
  border:3px solid rgba(255,255,255,.9);box-shadow:inset -8px -10px 20px rgba(80,150,220,.25), 0 8px 20px rgba(47,127,224,.18);
  display:grid;place-items:center;animation:bob 3s ease-in-out infinite}
.bubble:nth-child(2){animation-delay:-1s}.bubble:nth-child(3){animation-delay:-2s}
.bubble img{width:70%;height:70%;object-fit:contain}
.bubble.wrong{animation:shake .45s ease;border-color:var(--tomato);box-shadow:0 0 0 6px rgba(229,83,75,.3)}
.bubble.hint{box-shadow:0 0 0 8px rgba(246,196,69,.6), 0 0 30px 10px rgba(246,196,69,.5)}
.bubble.popped{animation:burst .45s ease forwards}
.bubble.fade{opacity:.25;transition:opacity .3s}
.reveal{position:absolute;inset:0;display:grid;place-items:center;z-index:3;pointer-events:none}
.reveal .card{background:var(--card);border-radius:24px;padding:14px 22px;display:flex;flex-direction:column;align-items:center;gap:4px;
  box-shadow:0 12px 40px rgba(58,46,41,.2);animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
.reveal img{width:clamp(110px,22vw,190px);aspect-ratio:1;object-fit:contain}
.reveal .w{font-family:var(--font-display);font-weight:800;font-size:clamp(24px,4vw,40px);color:#21753a}

/* ---------- say it ---------- */
.sayfield{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2.4vh,20px);
  background:var(--card);border-radius:var(--r);border:2px solid var(--line);padding:14px;position:relative}
.sayfield .pic{width:clamp(140px,34vh,300px);aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 8px 8px rgba(58,46,41,.2))}
.answer{min-height:1.3em;font-family:var(--font-display);font-weight:800;font-size:clamp(26px,4.6vw,44px);line-height:1.1}
.answer.ok{color:#21753a}.answer.soft{color:var(--ink-soft)}
.heardtxt{font-size:14px;color:var(--ink-soft);min-height:1.2em}
.mic{width:clamp(84px,12vh,104px);aspect-ratio:1;border-radius:50%;background:var(--tomato);color:#fff;display:grid;place-items:center;
  box-shadow:0 5px 0 #b63a33}
.mic svg{width:42%;height:42%}
.mic.listening{animation:micpulse 1s ease-in-out infinite}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.note{font-size:13px;color:var(--ink-soft);text-align:center;max-width:46ch}

/* ---------- recap ---------- */
.recap{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;background:var(--card);border-radius:var(--r);border:2px solid var(--line);padding:16px}
.recap h2{margin:0;font-family:var(--font-display);font-size:clamp(22px,3.4vw,32px);line-height:1.1;text-wrap:balance}
.score{display:flex;gap:10px;flex-wrap:wrap}
.score div{background:var(--paper);border-radius:14px;padding:8px 12px;font-weight:800;display:flex;gap:8px;align-items:center}
.score .num{font-family:var(--font-display);font-size:22px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.tile{background:var(--paper);border-radius:16px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid transparent}
.tile img{width:72px;height:72px;object-fit:contain}
.tile span{font-family:var(--font-display);font-weight:800;font-size:18px}
.tile.bounce img{animation:bounce .5s ease}

/* ---------- Kim helper ---------- */
.kim{position:fixed;z-index:20;left:max(10px, env(safe-area-inset-left, 0px));bottom:calc(10px + env(safe-area-inset-bottom, 0px));display:flex;align-items:flex-end;gap:6px;pointer-events:none}
.kim button{pointer-events:auto;width:62px;height:62px;border-radius:50%;background:var(--card);border:3px solid var(--sun);padding:0;overflow:hidden;box-shadow:0 4px 12px rgba(58,46,41,.2)}
.kim .bub{pointer-events:auto;max-width:min(72vw,420px);background:var(--card);border:2px solid var(--ink);border-radius:16px 16px 16px 4px;
  padding:6px 12px;font-weight:800;font-size:15px;line-height:1.25;margin-bottom:12px;animation:pop .3s ease both}
.kim.talk button{animation:bounce .5s ease}

/* ---------- start / menus ---------- */
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(58,46,41,.35);padding:16px}
.startcard{background:var(--card);border-radius:28px;max-width:520px;width:100%;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.startcard img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.startcard .in{padding:16px 20px 20px;display:flex;flex-direction:column;gap:10px}
.startcard .eyebrow{font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--blue)}
.startcard h1{margin:0;font-family:var(--font-display);font-size:clamp(30px,6vw,44px);line-height:1}
.startcard p{margin:0;color:var(--ink-soft)}
.startbtn{height:60px;border-radius:18px;background:var(--leaf);color:#fff;font-family:var(--font-display);font-weight:800;font-size:24px;box-shadow:0 5px 0 #2a7d41}
.menu{background:var(--card);border-radius:20px;padding:14px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:6px;max-height:80vh;overflow:auto}
.menu h3{margin:0 0 4px;font-family:var(--font-display)}
.menu button{text-align:left;padding:10px 12px;border-radius:12px;border:2px solid var(--line);font-weight:700}
.menu small{color:var(--ink-soft);font-weight:600}


/* ---------- grammar: sentence strip, actors, speech bubble ---------- */
.strip{position:absolute;left:50%;top:4%;transform:translateX(-50%);max-width:92%;text-align:center;
  background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:.25em .7em;
  font-family:var(--font-display);font-weight:700;font-size:clamp(16px,3.4vw,34px);line-height:1.2;box-shadow:0 6px 0 rgba(58,46,41,.15)}
.strip.fx{animation:pop .35s ease both}
.strip b,.csent b{background:#e6f0fc;color:var(--blue-deep);border:2px dashed var(--blue);border-radius:10px;padding:0 .2em;font-weight:800}
.strip b.m,.csent b.m{animation:merge .6s cubic-bezier(.3,1.6,.5,1) both;background:#fff2c9;border-color:#d9a21c;border-style:solid;color:var(--ink)}
.dimmer{position:absolute;inset:0;background:rgba(248,245,239,.82);backdrop-filter:blur(3px)}
.actor{position:absolute;height:auto;filter:drop-shadow(0 8px 8px rgba(58,46,41,.2));animation:pop .4s ease both}
.sbubble{position:absolute;background:var(--card);border:3px solid var(--ink);border-radius:20px 20px 20px 4px;padding:.3em .7em;
  font-family:var(--font-display);font-weight:800;font-size:clamp(14px,2.6vw,26px);animation:pop .35s ease both;max-width:44%}
@keyframes merge{0%{letter-spacing:.35em;transform:scale(.9)}60%{letter-spacing:-.02em;transform:scale(1.12)}100%{letter-spacing:0;transform:scale(1)}}

/* chunk cards */
.chunkgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-content:center}
.ccard{background:var(--card);border:3px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;text-align:center;min-width:0}
.ccard.now{border-color:var(--blue);box-shadow:0 0 0 4px rgba(47,127,224,.2)}
.cpic{position:relative;aspect-ratio:4/3;background:var(--paper);display:grid;place-items:center;overflow:hidden}
.cpic img{width:100%;height:100%;object-fit:cover}
.cpic img:first-child[src*="girl-plate"]{object-fit:contain;padding:6px}
.cpic .cfood{position:absolute;width:34%;height:auto;left:33%;top:46%;object-fit:contain}
.csent{padding:10px 8px 12px;font-family:var(--font-display);font-weight:700;font-size:clamp(15px,2.3vw,24px);line-height:1.25}
.tracker span.dot{width:auto;padding:0 10px;font-weight:800;font-size:14px;color:var(--ink-soft)}
.tracker span.dot.on{color:#21753a}

/* pick with characters */
.pickfield{gap:clamp(8px,2vh,18px)}
.psent{min-height:1.3em;font-family:var(--font-display);font-weight:800;font-size:clamp(20px,3.4vw,32px);color:#21753a}
.pickrow{display:flex;gap:clamp(8px,2.4vw,24px);justify-content:center;width:100%;position:relative;z-index:1}
.pcard{width:min(30%,240px);aspect-ratio:4/5;border-radius:20px;overflow:hidden;background:var(--card);border:4px solid #fff;box-shadow:0 8px 20px rgba(47,127,224,.18)}
.pcard img{width:100%;height:100%;object-fit:cover}
.pcard.wrong{animation:shake .45s ease;border-color:var(--tomato);box-shadow:0 0 0 6px rgba(229,83,75,.3)}
.pcard.hint{box-shadow:0 0 0 8px rgba(246,196,69,.6),0 0 30px 10px rgba(246,196,69,.5)}
.pcard.right{border-color:var(--leaf);box-shadow:0 0 0 6px rgba(58,166,87,.35);transform:scale(1.04);transition:transform .25s}
.pcard.fade{opacity:.3;transition:opacity .3s}

/* lift the lid */
.lidscene{display:flex;align-items:flex-end;justify-content:center;gap:clamp(12px,5vw,60px);width:100%}
.kidwrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.lidkid{height:clamp(150px,34vh,300px);width:auto;object-fit:contain}
.lidkid.me{height:clamp(110px,24vh,200px)}
.subj{font-family:var(--font-display);font-weight:800;font-size:clamp(20px,3vw,30px);background:var(--blue);color:#fff;border-radius:999px;padding:0 16px;box-shadow:0 3px 0 var(--blue-deep)}
.plate{position:relative;width:clamp(150px,30vw,260px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,#fff 0 56%,#eee7dc 57% 60%,#fff 61% 100%);box-shadow:0 10px 24px rgba(58,46,41,.18);display:grid;place-items:center}
.plate .shadow,.plate .lfood{position:absolute;width:62%;height:62%;object-fit:contain}
.plate .lfood{opacity:0;transform:scale(.7);transition:opacity .35s ease .2s,transform .35s ease .2s}
.lid{position:absolute;inset:-4%;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.75),rgba(205,225,240,.45) 45%,rgba(160,190,215,.55));
  border:3px solid rgba(255,255,255,.95);box-shadow:inset 0 -8px 18px rgba(80,120,160,.25);transition:transform .5s cubic-bezier(.4,1.4,.5,1),opacity .5s}
.lid::before{content:"";position:absolute;left:50%;top:-6%;width:16%;height:12%;transform:translateX(-50%);border-radius:50%;background:#cfd9e2;border:3px solid #fff}
.plate.open .lid{transform:translateY(-75%) rotate(-14deg);opacity:0}
.plate.open .lfood{opacity:1;transform:scale(1)}
.plate.open .shadow{opacity:0;transition:opacity .2s}

/* done */
.donebox{align-items:center;justify-content:center;text-align:center}
.donebox .trophy{font-size:64px;line-height:1;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.donebox .controls{width:100%;max-width:560px}
@media (max-width:640px){
  .chunkgrid{grid-template-columns:1fr;align-content:start;overflow:auto}
  .ccard{flex-direction:row;text-align:left;align-items:center}
  .cpic{width:42%;flex:none}
  .pcard{width:31%}
}

/* ---------- map (lesson home): Food Street at dusk-soft wash, cobbled road, three stalls ---------- */
.map{position:relative;flex:1;min-height:0;overflow:auto;border-radius:var(--r);border:2px solid var(--line);
  display:flex;flex-direction:column;align-items:center;padding:12px 12px 16px;gap:4px;isolation:isolate;background:var(--paper)}
.map::before{content:"";position:absolute;inset:-12px;z-index:-2;background:url("assets/i1/img/scene-street.webp") center 30%/cover no-repeat;
  filter:blur(3px) saturate(.75);opacity:.55}
.map::after{content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(248,245,239,.35) 0%,rgba(248,245,239,.72) 40%,rgba(248,245,239,.9) 100%)}
.maphead{position:relative;z-index:2;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}

.maphead h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(28px,5vw,46px);line-height:1;
  background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:4px 18px 6px;box-shadow:0 5px 0 #c99a5b;transform:rotate(-1.5deg)}
.mappath{position:relative;width:min(100%,480px);flex:1;min-height:300px;display:flex;flex-direction:column;justify-content:space-between;padding-block:6px}
.trail{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.trail path{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round}
.trail .edge{stroke:#cdb48d;stroke-width:58px}

.trail .stones{stroke:#e2cfae;stroke-width:40px;stroke-dasharray:9 13;stroke-linecap:butt}
.trail .mid{stroke:#fffaf0;stroke-width:3px;stroke-dasharray:2 10}
.deco{position:absolute;width:clamp(34px,7vw,52px);opacity:.9;filter:drop-shadow(0 3px 2px rgba(58,46,41,.2));pointer-events:none}
.node{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;width:50%}
.node.left{align-self:flex-start;transform:translateX(14%)}
.node.right{align-self:flex-end;transform:translateX(-14%)}
/* each part is a little stall: striped awning + sign board */
.nbtn{--n:clamp(64px,10vh,120px);position:relative;display:block}
.stall{--aw:var(--tomato);position:relative;display:block;width:var(--n);padding-top:calc(var(--n)*.26)}
.awning{display:block;position:absolute;left:-12%;right:-12%;top:0;height:calc(var(--n)*.3);border-radius:10px 10px 4px 4px;
  background:repeating-linear-gradient(90deg,var(--aw) 0 16.66%,#fffaf0 16.66% 33.33%);box-shadow:0 3px 0 rgba(58,46,41,.18);border:2px solid var(--ink)}
.awning::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:10px;
  background:radial-gradient(circle at 8.33% 0,var(--aw) 0 8px,transparent 9px) 0 0/16.66% 10px repeat-x}
.board{display:block;width:100%;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--card);border:4px solid #c99a5b;box-shadow:0 6px 0 #a87a43}
.board img{width:100%;height:100%;object-fit:cover}
.nbadge{position:absolute;right:-14%;top:calc(var(--n)*.18);min-width:34px;height:34px;border-radius:999px;display:grid;place-items:center;padding:0 6px;
  font-family:var(--font-display);font-weight:800;font-size:18px;background:var(--blue);color:#fff;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.18);z-index:2}
.node.done .nbadge{background:var(--leaf)}
.node.locked .nbadge{background:#cfc6b8;font-size:15px}
.node.locked .board img,.node.locked .awning{filter:grayscale(1);opacity:.55}
.nlabel{font-family:var(--font-display);font-weight:800;font-size:clamp(18px,2.6vw,24px);line-height:1;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:5px 14px 6px;white-space:nowrap}
.node.locked .nlabel{border-color:#cfc6b8;color:var(--ink-soft)}
.pips{display:flex;gap:5px;min-height:12px;align-items:center}
.pips i{width:12px;height:12px;border-radius:50%;background:#fffaf0;border:2px solid #cdb48d;transition:background .3s,border-color .3s,transform .3s}
.pips i.on{background:var(--leaf);border-color:#2a7d41;transform:scale(1.1)}
.nstars{font-size:20px;color:#e2a91c;letter-spacing:.06em;line-height:1;text-shadow:0 1px 0 #fff}
.nstars .off{color:#d8cdbd}
.nsoon{font-weight:700;font-size:13px;color:var(--ink-soft);background:rgba(255,255,255,.8);border-radius:999px;padding:2px 10px}
.node.current .stall{animation:nodebob 1.4s ease-in-out infinite}
.node.current .board{border-color:var(--blue);box-shadow:0 6px 0 var(--blue-deep),0 0 0 6px rgba(47,127,224,.22)}
.node.celebrate .stall{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@media (max-width:640px){.maphead h1{font-size:26px}.nlabel{font-size:16px;padding:4px 12px}.nstars{font-size:17px}}
@keyframes nodebob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* ---------- FL ---------- */
.strip .q,.cq{color:var(--tomato);font-weight:800}
.strip br{content:"";display:block;margin-top:.15em}
.cq{padding:10px 8px 0;font-family:var(--font-display);font-size:clamp(15px,2.2vw,22px);line-height:1.2}
.cq.big{font-size:clamp(22px,3.6vw,34px);padding:0;text-align:center}
.ca{padding-top:4px}
.ctext{display:flex;flex-direction:column;min-width:0;flex:1}
.namefield{gap:clamp(8px,2vh,16px)}
.nametag{font-family:var(--font-display);font-weight:800;font-size:clamp(26px,4vw,40px);background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:0 18px 2px;min-width:3em;text-align:center;box-shadow:0 4px 0 #c99a5b}
.nametag:empty{visibility:hidden}
.crowd{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(6px,1.4vw,14px);width:100%;max-width:980px;position:relative;z-index:1}
.kid{position:relative;border-radius:16px;overflow:visible;background:var(--card);border:3px solid #fff;box-shadow:0 6px 16px rgba(47,127,224,.15);aspect-ratio:4/5;padding:0}
.kid img{width:100%;height:100%;object-fit:cover;border-radius:13px}
.kid .ktag{position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);font-family:var(--font-display);font-weight:800;font-size:clamp(13px,1.8vw,18px);
  background:var(--leaf);color:#fff;border-radius:999px;padding:1px 10px;white-space:nowrap;box-shadow:0 2px 0 #2a7d41}
.kid .ktag:empty{display:none}
.kid.named{border-color:var(--leaf)}
.kid.wrong{animation:shake .45s ease;border-color:var(--tomato)}
.kid.hint{box-shadow:0 0 0 8px rgba(246,196,69,.6),0 0 30px 10px rgba(246,196,69,.5)}
.apic{position:relative;display:grid;place-items:center}
.apic .aimg{height:clamp(150px,30vh,280px);width:auto;border-radius:18px;box-shadow:0 8px 20px rgba(58,46,41,.15)}
.apic.me .aimg{height:clamp(100px,20vh,180px);box-shadow:none}
.aplate{display:flex;gap:6px;justify-content:center;align-items:center;margin-top:-10px;width:clamp(140px,26vw,220px);aspect-ratio:1.6;border-radius:50%;
  background:radial-gradient(ellipse,#fff 0 58%,#eee7dc 60% 63%,#fff 65%);box-shadow:0 8px 20px rgba(58,46,41,.15)}
.aplate img{width:42%;height:auto}
.finish{display:flex;align-items:center;gap:8px;background:var(--leaf);color:#fff;border-radius:999px;padding:3px 14px 3px 8px;box-shadow:0 3px 0 #2a7d41;margin-top:6px}
.finish b{font-family:var(--font-display);font-size:18px}
.finish .cup{font-size:24px;line-height:1}
.finish .fstars{font-weight:700;color:#fff6d0}
.finish.pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
@media (max-width:640px){
  .crowd{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 10px}
  .kid{aspect-ratio:1}
}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-14%)}70%{transform:translateY(3%)}}
@keyframes ringpulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.12)}}
@keyframes arrow{from{transform:translate(-50%,0)}to{transform:translate(-50%,-8px)}}
@keyframes hotpulse{0%,100%{border-color:rgba(47,127,224,.0);background:rgba(47,127,224,0)}50%{border-color:rgba(47,127,224,.85);background:rgba(47,127,224,.08)}}
@keyframes speakpulse{0%,100%{box-shadow:0 4px 0 var(--blue-deep),0 0 0 0 rgba(47,127,224,.5)}50%{box-shadow:0 4px 0 var(--blue-deep),0 0 0 10px rgba(47,127,224,0)}}
@keyframes micpulse{0%,100%{box-shadow:0 5px 0 #b63a33,0 0 0 0 rgba(229,83,75,.5)}50%{box-shadow:0 5px 0 #b63a33,0 0 0 18px rgba(229,83,75,0)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
@keyframes burst{to{transform:scale(1.4);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

@media (orientation:portrait){
  main{justify-content:center}
  .stagewrap{flex:0 0 auto}
}
@media (max-width:640px){
  #app{gap:8px;padding-block:8px 70px}
  .top .tag{font-size:13px;padding:7px 10px}
  .caption{min-height:56px}
  .speak{width:44px;height:44px}
  .ctl{height:42px;padding:0 11px}
  .ctl .t{display:none}
  .kim button{width:52px;height:52px}
}

/* =====================================================================
   FULL-SCREEN LAYER (2026-11-10): scene fills the screen, UI floats on it,
   Kim stands in the bottom-left corner and moves with what she says.
   ===================================================================== */
:root{--kimH:clamp(130px,26vh,230px);--kimW:calc(var(--kimH)*.62);--glass:rgba(255,255,255,.84);--topH:64px}
@media (orientation:portrait){:root{--kimH:clamp(104px,15vh,150px)}}
body{padding:0;overflow:hidden;background:var(--paper)}
#bg{position:fixed;inset:-30px;z-index:0;background:var(--paper) center/cover no-repeat;filter:blur(16px) saturate(.8);opacity:.75}
#bg::after{content:"";position:absolute;inset:0;background:rgba(248,245,239,.45)}
#app{position:fixed;inset:0;z-index:1;max-width:none;margin:0;padding:0;display:block}
.top{position:absolute;z-index:15;left:0;right:0;top:0;min-height:0;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.top .tag,.iconbtn{background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-color:rgba(255,255,255,.9)}
.progress i{background:rgba(255,255,255,.65);box-shadow:inset 0 0 0 1.5px rgba(58,46,41,.12)}
.progress i.now{background:linear-gradient(90deg,var(--blue) 0 55%,rgba(255,255,255,.65) 55%)}
main{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + var(--topH)) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) calc(var(--kimW) + max(20px,env(safe-area-inset-left,0px)))}
@media (orientation:portrait){
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-bottom:calc(env(safe-area-inset-bottom,0px) + var(--kimH) + 8px)}
}
/* cards float on the backdrop */
.field,.sayfield,.recap{border:0;border-radius:24px;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 10px 40px rgba(58,46,41,.12)}
.field{background:linear-gradient(rgba(207,233,251,.88),rgba(234,246,255,.8) 60%,rgba(248,252,255,.75))}
.ccard{background:var(--glass);border-color:rgba(255,255,255,.95)}

/* ---- scene views: the picture is the screen ---- */
body[data-view="watch"] main,body[data-view="explore"] main{padding:0}
.stagewrap{position:absolute;inset:0;display:block}
.stage{position:absolute;inset:0;width:100%!important;height:100%;max-height:none;aspect-ratio:auto;border-radius:0;box-shadow:none;background:transparent;overflow:hidden}
.blurfill{position:absolute;inset:-40px;background:center/cover no-repeat;filter:blur(22px) saturate(.85);opacity:0;transition:opacity .4s}
.stage.contain .blurfill{opacity:1}
.stage.contain .blurfill::after{content:"";position:absolute;inset:0;background:rgba(248,245,239,.35)}
.canvas{position:absolute;overflow:hidden}
.stage.contain .canvas{border-radius:18px;box-shadow:0 12px 40px rgba(58,46,41,.25)}
.counter{bottom:14%;left:10%;right:10%}
.food{width:15%}
.strip{top:14%}
.stage.contain .strip{top:4%}
/* dock floats at the bottom, right of Kim */
body[data-view="watch"] .dock,body[data-view="explore"] .dock{position:absolute;z-index:6;
  left:calc(var(--kimW) + max(20px,env(safe-area-inset-left,0px)));right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(env(safe-area-inset-bottom,0px) + 14px);background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-radius:20px;padding:8px 10px;box-shadow:0 8px 30px rgba(58,46,41,.18)}
body[data-view="watch"] .caption{border:0;background:transparent;padding:0;min-height:0}
body[data-view="watch"] .chips{display:none}
@media (orientation:portrait){
  body[data-view="watch"] .dock,body[data-view="explore"] .dock{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
    bottom:calc(env(safe-area-inset-bottom,0px) + var(--kimH) + 8px)}
}

/* ---- Kim: bigger, standing in the corner, moves ---- */
.kim{left:max(8px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 4px);display:block;width:var(--kimW);height:var(--kimH);pointer-events:none}
.kim button{display:block;width:100%;height:100%;border:0;border-radius:0;background:none;box-shadow:none;overflow:visible;padding:0;
  transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite;filter:drop-shadow(0 6px 6px rgba(58,46,41,.25))}
.kim .kimimg{width:100%;height:100%;object-fit:contain;object-position:50% 100%}
.kim .bub{position:absolute;left:calc(100% - 18px);bottom:calc(100% - 26px);margin:0;max-width:min(64vw,360px);width:max-content;
  border-radius:18px 18px 18px 4px;font-size:16px;box-shadow:0 6px 20px rgba(58,46,41,.15)}
@media (orientation:portrait){.kim .bub{left:calc(100% - 6px);bottom:24%;max-width:calc(100vw - var(--kimW) - 30px)}}
.kim.talking button{animation:talkbob .32s ease-in-out infinite alternate}
.kim[data-pose="cheer"] button{animation:jump .55s cubic-bezier(.3,1.6,.5,1) 2}
.kim[data-pose="listen"] button{animation:lean 1.4s ease-in-out infinite}
.kim[data-pose="think"] button{animation:tilt 1.2s ease-in-out 2}
.kim.talk button{animation:none}
/* puppet poses (placeholder art) */
.puppet .arm{transform-box:view-box;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.puppet .armL{transform-origin:40px 86px}.puppet .armR{transform-origin:80px 86px}
.puppet .head{transform-box:view-box;transform-origin:60px 80px;transition:transform .35s}
.kim[data-pose="idle"] .armR{animation:wave 2.4s ease-in-out infinite}
.kim[data-pose="talk"] .armR,.kim[data-pose="point"] .armR{transform:rotate(-80deg)}
.kim[data-pose="cheer"] .armL{transform:rotate(155deg)}.kim[data-pose="cheer"] .armR{transform:rotate(-155deg)}
.kim[data-pose="listen"] .armR{transform:rotate(-160deg)}.kim[data-pose="listen"] .head{transform:rotate(8deg)}
.kim[data-pose="think"] .armR{transform:rotate(-140deg)}.kim[data-pose="think"] .head{transform:rotate(-8deg)}
.kim.talking .mouth{animation:mouth .18s steps(2) infinite}
.puppet .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.025)}}
@keyframes talkbob{from{transform:translateY(0) rotate(-1deg)}to{transform:translateY(-4%) rotate(1.5deg)}}
@keyframes jump{0%,100%{transform:translateY(0)}45%{transform:translateY(-16%) scale(1.04)}}
@keyframes lean{0%,100%{transform:rotate(0)}50%{transform:rotate(4deg)}}
@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-5deg)}70%{transform:rotate(3deg)}}
@keyframes wave{0%,40%,100%{transform:rotate(0)}55%{transform:rotate(-150deg)}65%{transform:rotate(-120deg)}75%{transform:rotate(-150deg)}85%{transform:rotate(-120deg)}}
@keyframes mouth{0%{transform:scaleY(1)}100%{transform:scaleY(.4)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
/* map: full-bleed on the backdrop */
body[data-view="map"] main{padding-left:max(16px,env(safe-area-inset-left,0px))}
body[data-view="map"] .map{border:0;background:transparent;border-radius:0;padding-top:0}
body[data-view="map"] .map::before,body[data-view="map"] .map::after{display:none}
.overlay{z-index:40}

:root{--sat:env(safe-area-inset-top,0px)}
/* short screens (phones held sideways): one-row dock, smaller game pieces */
@media (max-height:520px){
  :root{--kimH:clamp(92px,30vh,130px);--topH:54px}
  .top{padding-top:calc(env(safe-area-inset-top,0px) + 6px)}
  .iconbtn{width:38px;height:38px}
  body[data-view="watch"] .dock{flex-direction:row;align-items:center;padding:6px 8px}
  body[data-view="watch"] .caption{flex:1;min-width:0}
  .caption .txt{font-size:18px}
  .speak{width:38px;height:38px}.speak.big{width:56px;height:56px}
  .ctl{height:38px;padding:0 10px}
  .ctl .t{display:none}
  .tracker span{width:30px;height:30px}.tracker img{width:24px;height:24px}
  body[data-view="explore"] .dock .controls{flex-wrap:nowrap}
  .bubble{--s:min(26vw,40vh)}
  .plate{width:min(30vw,42vh)}
  .lidkid{height:38vh}
  .sayfield .pic{width:min(34vh,200px)}
  .pcard{width:min(24%,30vh)}
  .kim .bub{font-size:14px;max-width:min(46vw,300px)}
  .sayfield{overflow:auto;gap:6px}
  .mic{width:60px}
  .lidkid{height:30vh}.plate{width:min(26vw,34vh)}
}

/* =====================================================================
   PIXIE-STYLE FRAME (2026-11-11): practice, review cards and the map sit in a
   phone-shaped column; scene views (Watch/Explore) stay full-screen.
   ===================================================================== */
:root{--frameW:min(100vw,440px);--groundH:74px}
body.framed .top{display:none}
/* 2026-11-16: back to full screen everywhere — the frame keeps its task bar, tray, Aa and sidewalk, but spans the whole screen */
body.framed main{left:0;right:0;width:auto;transform:none;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(env(safe-area-inset-bottom,0px) + var(--groundH) + 70px) 14px;
  background:linear-gradient(180deg,#d6ecfa 0%,#eef7fd 45%,#fbf6ee 82%);overflow:hidden}
body.framed main > *:not(.taskbar){width:100%;max-width:760px;margin-inline:auto}
body.framed .taskbar{width:100%;max-width:980px;margin-inline:auto}
body.framed main > .chunkgrid{max-width:980px}
/* sidewalk the guide stands on */
body.framed main::after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--groundH);z-index:0;
  background:repeating-linear-gradient(90deg,#e8d9bf 0 46px,#dccaa9 46px 48px),#e8d9bf;border-top:6px solid #cdb48d;
  box-shadow:inset 0 10px 0 rgba(255,255,255,.35)}
body.framed main > *{position:relative;z-index:1}
body.framed .field,body.framed .sayfield,body.framed .recap{background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;border:0;padding:6px 0}
body.framed .field::before,body.framed .field::after{opacity:.9}
.field > *{position:relative;z-index:1}
body[data-view="map"].framed main{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);background:transparent}
body[data-view="map"].framed main::after{display:none}
body[data-view="map"] .kim{display:none}
/* Kim stands on the sidewalk inside the frame */
body.framed .kim{--kimH:clamp(120px,22vh,200px);--kimW:calc(var(--kimH)*.62);left:max(12px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + var(--groundH) * .35)}
body.framed .kim .bub{left:calc(100% - 8px);bottom:55%;max-width:min(420px,calc(100vw - var(--kimW) - 40px))}

/* task bar: ✕ · progress · tray · Aa · ☰ */
.taskbar{display:flex;align-items:center;gap:8px;flex:none}
.tb-x,.tb-menu,.tb-aa{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:var(--ink-soft);background:rgba(255,255,255,.75)}
.tb-aa{font-family:var(--font-display);font-size:15px}
.tb-aa.on{background:var(--ink);color:#fff}
.tb-prog{flex:0 0 46px;height:8px;border-radius:99px;background:rgba(255,255,255,.8);overflow:hidden}
.tb-prog i{display:block;height:100%;background:var(--blue);border-radius:99px}
.tb-title{flex:1;font-family:var(--font-display);font-weight:800;text-align:center}
.tray{flex:1;display:flex;gap:4px;justify-content:center;background:rgba(255,255,255,.85);border-radius:12px;padding:4px;min-width:0}
.tray i{flex:1;max-width:30px;aspect-ratio:1;border-radius:8px;background:#efe7f6;display:grid;place-items:center;overflow:hidden}
.tray i.now{box-shadow:inset 0 0 0 2px var(--blue)}
.tray i.full{background:#fff7dd}
.tray i.try{background:#eee}
.tray i img{width:100%;height:100%;object-fit:contain}

}

/* ---------- home: units → lessons (2026-11-16) ---------- */

.backlink{align-self:flex-start;font-weight:800;font-size:15px;background:rgba(255,255,255,.85);border-radius:999px;padding:6px 14px;box-shadow:0 2px 0 rgba(58,46,41,.12)}

.unitcard{display:flex;flex-direction:column;border-radius:20px;overflow:hidden;background:var(--card);box-shadow:0 6px 0 #d8cdbd;text-align:left;border:3px solid #fff}

.uletter{font-family:var(--font-display);font-weight:800;font-size:48px;color:#cbbda8}

.utext span{font-size:14px;color:var(--ink-soft)}
.utext em{font-style:normal;font-weight:700;font-size:12px;color:#a08f7c;background:#f1ebe2;border-radius:999px;padding:1px 8px;align-self:flex-start;margin-top:4px}
.unitcard.soon{opacity:.6;box-shadow:none;background:rgba(255,255,255,.7)}
.unitcard:not(.soon){border-color:var(--blue);box-shadow:0 6px 0 var(--blue-deep)}

.lessoncard .lnum{flex:none;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:22px;background:#fff2c9;color:var(--ink)}
.lessoncard .ltext{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lessoncard .ltext b{font-family:var(--font-display);font-size:19px;line-height:1.15}

.lessoncard.current .lnum{background:var(--blue);color:#fff;animation:nodebob 1.4s ease-in-out infinite}
.lessoncard.soon{opacity:.55;box-shadow:none;background:rgba(255,255,255,.7)}
.menu .warn{color:#b63a33;font-weight:700}
body[data-view="units"] main,body[data-view="unit"] main{background:transparent}

/* author audio check page */
.voicelist{gap:6px;max-width:760px}

/* =====================================================================
   2026-11-17: Kim only where she guides.
   · scenes (Watch/Explore) and home screens: just her head, like a speaker avatar
   · practice, review cards, recap, done: no Kim (her voice still gives the instruction)
   ===================================================================== */
.kim .kimhead{display:none}
body[data-view="watch"],body[data-view="explore"],body[data-view="units"],body[data-view="unit"],body[data-view="voices"]{--av:clamp(72px,11vh,104px);--kimW:var(--av)}
body:is([data-view="watch"],[data-view="explore"],[data-view="units"],[data-view="unit"],[data-view="voices"]) .kim{
  width:var(--av);height:var(--av);left:max(14px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
body:is([data-view="watch"],[data-view="explore"],[data-view="units"],[data-view="unit"],[data-view="voices"]) .kim button{
  border-radius:50%;overflow:hidden;background:#fff6e0;border:4px solid #fff;box-shadow:0 6px 18px rgba(58,46,41,.28);filter:none;animation:none}
body:is([data-view="watch"],[data-view="explore"],[data-view="units"],[data-view="unit"],[data-view="voices"]) .kim.talking button{animation:talkbob .32s ease-in-out infinite alternate}
body:is([data-view="watch"],[data-view="explore"],[data-view="units"],[data-view="unit"],[data-view="voices"]) .kim .kimimg,
body:is([data-view="watch"],[data-view="explore"],[data-view="units"],[data-view="unit"],[data-view="voices"]) .kim .puppet{display:none!important}
body:is([data-view="watch"],[data-view="explore"],[data-view="units"],[data-view="unit"],[data-view="voices"]) .kim .kimhead:not([hidden]){display:block;width:100%;height:100%;object-fit:cover}
body:is([data-view="watch"],[data-view="explore"],[data-view="units"],[data-view="unit"],[data-view="voices"]) .kim .bub{left:calc(100% + 8px);bottom:50%;transform:translateY(50%);border-radius:18px 18px 18px 4px}
/* dock sits right of the head in every orientation */
body[data-view="watch"] .dock,body[data-view="explore"] .dock{left:calc(var(--av) + max(26px,env(safe-area-inset-left,0px)));bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
@media (orientation:portrait){
  body[data-view="watch"] .dock,body[data-view="explore"] .dock{left:calc(var(--av) + 26px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
}
/* practice & cards: no Kim, no sidewalk; content gets the space back */
body.framed:not([data-view="units"]):not([data-view="unit"]):not([data-view="voices"]) .kim{display:none}
body.framed:not([data-view="units"]):not([data-view="unit"]):not([data-view="voices"]) main::after{display:none}
body.framed:not([data-view="units"]):not([data-view="unit"]):not([data-view="voices"]) main{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
body:is([data-view="units"],[data-view="unit"],[data-view="voices"]) main::after{display:none}
body:is([data-view="units"],[data-view="unit"],[data-view="voices"]) main{padding-bottom:calc(env(safe-area-inset-bottom,0px) + var(--av) + 24px)}

/* adapt game pieces to the screen height too, so nothing is pushed off-screen */
.field,.sayfield{justify-content:safe center;overflow:auto}
.bubble{--s:clamp(80px,min(27vw,24vh),200px)}
.reveal img{width:clamp(96px,min(22vw,22vh),190px)}
.pcard{width:min(30%,240px,32vh)}
.crowd{max-width:min(980px,118vh)}
.lidkid{height:clamp(110px,28vh,280px)}
.plate{width:clamp(120px,min(30vw,28vh),240px)}
.sayfield .pic{width:clamp(110px,28vh,280px)}
.apic .aimg{height:clamp(120px,26vh,260px)}
.chunkgrid{overflow:auto}

/* 💡 hint on Lift the lid: top-right of the plate; the food word appears under the plate */
.platewrap{position:relative;display:grid;place-items:center}
.bulb{position:absolute;top:2%;right:-4%;width:clamp(48px,7vh,64px);height:clamp(48px,7vh,64px);border-radius:50%;border:3px solid #fff;background:#fff6c9;
  font-size:clamp(24px,3.6vh,32px);box-shadow:0 4px 0 #e2c55a,0 8px 18px rgba(58,46,41,.18);cursor:pointer;animation:bulbGlow 2.4s ease-in-out infinite}
.bulb:active{transform:translateY(3px);box-shadow:0 1px 0 #e2c55a}
.bulb.used{animation:none;background:#fff;box-shadow:0 4px 0 #ddd}
@keyframes bulbGlow{0%,100%{box-shadow:0 4px 0 #e2c55a,0 0 0 0 rgba(255,214,70,0)}50%{box-shadow:0 4px 0 #e2c55a,0 0 0 10px rgba(255,214,70,.35)}}
.wordchip{position:absolute;left:50%;bottom:-6%;transform:translateX(-50%);background:#fff;border:3px solid #f2c94c;color:var(--ink);
  font-family:var(--font-display);font-weight:800;font-size:clamp(20px,3.4vh,30px);padding:2px 18px;border-radius:999px;white-space:nowrap;box-shadow:0 4px 12px rgba(58,46,41,.15)}

/* 2026-11-17 (b): exercise intro — Kim's head + purple text bubble while she reads the instruction, then she leaves */
body.framed.kim-intro:not([data-view="units"]):not([data-view="unit"]):not([data-view="voices"]):not([data-view="map"]) .kim{
  display:block;--av:clamp(64px,10vh,92px);width:var(--av);height:var(--av);left:max(14px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);animation:kimIn .3s ease-out}
body.framed.kim-intro .kim button{border-radius:50%;overflow:hidden;background:#f3edff;border:4px solid #fff;box-shadow:0 6px 18px rgba(58,46,41,.28);filter:none;animation:none}
body.framed.kim-intro .kim.talking button{animation:talkbob .32s ease-in-out infinite alternate}
body.framed.kim-intro .kim .kimimg,body.framed.kim-intro .kim .puppet{display:none!important}
body.framed.kim-intro .kim .kimhead:not([hidden]){display:block;width:100%;height:100%;object-fit:cover}
body.framed.kim-intro .kim .bub{left:calc(100% + 10px);bottom:50%;transform:translateY(50%);width:max-content;max-width:min(560px,calc(100vw - var(--av) - 48px));
  background:#7b5cd6;color:#fff;border:none;border-radius:20px 20px 20px 6px;padding:12px 18px;font-size:clamp(17px,2.4vh,22px);box-shadow:0 8px 22px rgba(80,50,160,.3)}
@keyframes kimIn{from{opacity:0;transform:translateY(12px) scale(.9)}to{opacity:1;transform:none}}
.apic.me .aimg{height:clamp(70px,16vh,180px)}
.aplate{width:clamp(110px,min(26vw,36vh),220px)}
@media (max-height:480px){.cq.big{font-size:clamp(18px,6vh,28px);margin:4px 0}}

/* =====================================================================
   CP6b (2026-11-17) — Reading & Writing step types: choose · spell · build · sort · gaptext
   ===================================================================== */
.choosefield,.spellfield,.buildfield,.gapfield,.sortfield{gap:clamp(10px,2.2vh,22px)}
.cprompt{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:min(900px,96vw)}
.cprompt .cpic,.spellfield .cpic{height:clamp(110px,26vh,250px);width:auto;max-width:80vw;object-fit:contain;border-radius:18px;background:#fff;
  border:4px solid #fff;box-shadow:0 8px 20px rgba(58,46,41,.14)}
.cpics{display:flex;gap:10px;justify-content:center}
.cpics img{height:clamp(90px,20vh,190px);width:auto;border-radius:16px;background:#fff;border:4px solid #fff;box-shadow:0 6px 16px rgba(58,46,41,.12)}
.ctext{font-family:var(--font-display);font-weight:800;color:var(--ink);text-align:center;line-height:1.25;
  background:#fff;border-radius:18px;padding:10px 20px;box-shadow:0 4px 0 var(--line)}
.ctext.big{font-size:clamp(22px,4.2vh,40px)}
.ctext.q{font-size:clamp(20px,3.6vh,34px);color:var(--blue-deep)}
.ctext u,.copt u,.cfix u,.recap .tile u,.spword u{text-decoration:none;color:var(--tomato);background:rgba(229,83,75,.12);border-radius:6px;padding:0 2px}
.cnote{font-size:15px;color:var(--ink-soft)}
.copts{display:flex;flex-wrap:wrap;gap:clamp(8px,2vw,20px);justify-content:center;width:100%;max-width:min(980px,96vw)}
.copt{background:#fff;border:4px solid #fff;border-radius:20px;box-shadow:0 6px 0 var(--line),0 10px 20px rgba(58,46,41,.1);
  transition:transform .15s, opacity .3s;font-family:var(--font-display);font-weight:800;color:var(--ink)}
.copt:active{transform:translateY(3px)}
.copt.pic{width:clamp(96px,min(26vw,24vh),210px);aspect-ratio:1;display:grid;place-items:center;padding:8px}
.copt.pic img{width:100%;height:100%;object-fit:contain}
.copt.txt{min-width:min(78vw,240px);padding:12px 22px;font-size:clamp(20px,3.4vh,30px);text-align:center}
.lay-stack .copts{flex-direction:column;align-items:center}
.lay-stack .copt.txt{width:min(92vw,560px)}
.copt.mark{width:clamp(84px,12vh,120px);min-width:0;aspect-ratio:1;font-size:clamp(40px,7vh,64px);padding:0}
.copt.mark.tick{color:var(--leaf)}.copt.mark.cross{color:var(--tomato)}
.copt.wrong,.ltile.wrong,.btile.wrong,.stray.wrong,.gword.wrong{animation:shake .45s ease;border-color:var(--tomato)!important;box-shadow:0 0 0 6px rgba(229,83,75,.3)!important}
.copt.hint,.ltile.hint,.btile.hint,.gword.hint{box-shadow:0 0 0 8px rgba(246,196,69,.6),0 0 30px 10px rgba(246,196,69,.5)!important;animation:blink 1s ease-in-out infinite}
.copt.right{border-color:var(--leaf);box-shadow:0 0 0 6px rgba(58,166,87,.35);transform:scale(1.04)}
.copt.fade{opacity:.3}
.cfix{font-family:var(--font-display);font-weight:800;font-size:clamp(18px,3vh,28px);color:#21753a;background:#eaf7ee;border-radius:14px;padding:6px 16px}
@keyframes blink{50%{transform:scale(1.06)}}

/* spell: letter tiles */
.picwrap{position:relative;display:inline-block;width:fit-content;align-self:center}
.bulb.small{top:-10px;right:-14px;width:48px;height:48px;font-size:24px}
.spline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.spline .form{font-family:var(--font-display);font-weight:800;font-size:clamp(26px,5vh,44px);color:var(--ink-soft)}
.spword{display:flex;gap:6px;align-items:flex-end}
.spword .given,.spword .slot{font-family:var(--font-display);font-weight:800;font-size:clamp(28px,5.4vh,50px);line-height:1;min-width:clamp(28px,4.6vh,46px);text-align:center}
.spword .slot{height:clamp(44px,7vh,64px);border-bottom:5px solid var(--line);color:var(--blue-deep);display:grid;place-items:end center;padding-bottom:4px}
.spword .slot.now{border-color:var(--blue);background:rgba(47,127,224,.08);border-radius:10px 10px 0 0}
.spword .sp{width:18px}
.spword.done .given,.spword.done .slot{color:var(--leaf)}
.tiles,.btiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:min(760px,94vw)}
.ltile{width:clamp(52px,8.5vh,72px);height:clamp(52px,8.5vh,72px);border-radius:16px;background:#fff7e0;border:3px solid #fff;
  font-family:var(--font-display);font-weight:800;font-size:clamp(26px,4.6vh,40px);color:var(--ink);box-shadow:0 5px 0 #e8c38c}
.ltile.used,.btile.used{visibility:hidden}

/* build: sentence tiles */
.bslots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:64px;padding:10px;border-radius:20px;background:rgba(255,255,255,.6);max-width:min(900px,96vw)}
.bslot{min-width:clamp(80px,14vw,150px);min-height:clamp(46px,7vh,60px);border-radius:14px;border:3px dashed var(--line);display:grid;place-items:center;padding:4px 12px;
  font-family:var(--font-display);font-weight:800;font-size:clamp(20px,3.4vh,30px)}
.bslot.now{border-color:var(--blue);background:rgba(47,127,224,.08)}
.bslot.filled{border-style:solid;border-color:#fff;background:#fff;box-shadow:0 4px 0 var(--line)}
.bslots.done .bslot{border-color:var(--leaf)}
.btile{padding:10px 18px;border-radius:14px;background:#fff;border:3px solid #fff;box-shadow:0 5px 0 var(--line);font-family:var(--font-display);font-weight:800;font-size:clamp(20px,3.4vh,30px);color:var(--ink)}
.sick{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:clamp(20px,3.4vh,30px);color:var(--tomato);background:#fff1f0;border-radius:16px;padding:8px 16px}
.sick .thermo{font-size:1.3em}
/* burger style: bun · patty · bun */
/* layers get their bun / patty look only once they are in place — the tiles stay neutral so they don't give the order away */
.st-burger .bslot.filled.l0{background:#f3c26b;border-color:#e2a744;border-radius:40px 40px 14px 14px}
.st-burger .bslot.filled.l1{background:#8a4b2a;color:#fff;border-color:#6d3a20}
.st-burger .bslot.filled.l2{background:#f3c26b;border-color:#e2a744;border-radius:14px 14px 40px 40px}
.st-burger .bslot:not(.filled){background:transparent;color:transparent;border-style:dashed;border-color:var(--line)}
.st-burger .bslot.now{border-color:var(--blue)}
.st-burger .bslots{flex-direction:column;align-items:center}
.st-burger .bslot{min-width:min(70vw,360px)}

/* sort: trays */
.strays{display:flex;gap:clamp(8px,2vw,20px);justify-content:center;width:100%;max-width:min(1000px,96vw)}
.stray{flex:1;min-height:clamp(120px,24vh,220px);border-radius:24px;background:#fff8ec;border:4px solid #fff;box-shadow:0 6px 0 var(--wood);display:flex;flex-direction:column;align-items:center;padding:8px;gap:6px}
.stray .tbox{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-content:flex-start;flex:1}
.stray .tbox img{width:clamp(34px,6vh,58px);height:clamp(34px,6vh,58px);object-fit:contain}
.stray .tname{font-family:var(--font-display);font-weight:800;font-size:clamp(18px,3vh,26px);color:var(--blue-deep)}
.stray .tname.hidden{visibility:hidden}
.stray.named{border-color:var(--leaf)}
.scards{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:min(900px,96vw)}
.scard{width:clamp(64px,11vh,96px);aspect-ratio:1;border-radius:16px;background:#fff;border:3px solid #fff;box-shadow:0 5px 0 var(--line);padding:4px;display:flex;flex-direction:column;align-items:center}
.scard img{width:100%;flex:1;min-height:0;object-fit:contain}
.scard span{font-size:12px;font-weight:700}
.scard.picked{border-color:var(--blue);transform:translateY(-6px) scale(1.06);box-shadow:0 10px 20px rgba(47,127,224,.3)}

/* gaptext */
.gtitle{font-family:var(--font-display);margin:0}
.gtext{background:#fff;border-radius:20px;padding:16px 22px;max-width:min(760px,94vw);font-size:clamp(19px,3vh,26px);line-height:1.9;box-shadow:0 6px 0 var(--line)}
.gap{display:inline-block;min-width:4.5em;text-align:center;border-bottom:3px solid var(--line);font-family:var(--font-display);font-weight:800;color:var(--ink-soft);line-height:1.3}
