/* Base: one-screen app. #app fills the window; every screen draws itself inside <main> (body.v3 = the white DOL frame). */
:root{color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#fff;color:#242938;font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid #4A6FD6;outline-offset:3px}
button:disabled{cursor:default}
img{max-width:100%;-webkit-user-drag:none;user-select:none}
img:not([src]),img[src=""]{visibility:hidden}
#app{position:fixed;inset:0}
main{position:absolute;inset:0;overflow:hidden}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}

/* =====================================================================
   V3 (2026-11-18) — giao diện v3, decisions #52–#56. Mockup: tools/design-v3/v3k.html.
   Practice screens (.px); the tokens and fonts are shared by every screen.
   Flat DOL surfaces: white page, light grey cards, thin borders, 2–3px bottom shadows.
   Red = the child acts (mic, CHECK, CONTINUE) · blue = listen (speakers, progress) · green only on the "correct" sheet.
   ===================================================================== */
:root{
  --red:#E05848;--red-d:#C8443A;--red-l:#FDECE9;
  --blue:#4A6FD6;--blue-d:#3756B5;--blue-l:#EDF1FC;
  --ink:#242938;--mute:#6C7885;--line:#E3E7ED;--surf:#F4F5F7;
  --green:#3FA45B;--green-d:#2F8547;--green-l:#E4F6E8;--gold:#F2B33D;--gold-d:#C98B12;
  --ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --read:"Andika","Plus Jakarta Sans",system-ui,sans-serif;
}

/* -- 1. page + scale --
   --u = one pixel of the 390×844 phone mockup, from the screen's width and height: a tablet scales up,
   a short laptop scales down, a phone held sideways stops at .62 and uses the two-column layout (section 9). */
body.v3{--u:clamp(.62px, min(100vw / 390, 100vh / 844), 1.34px);--g:calc(16 * var(--u));--col:920px;--aares:max(72px, calc(76 * var(--u)));background:#fff}
@supports (height:100dvh){body.v3{--u:clamp(.62px, min(100vw / 390, 100dvh / 844), 1.34px)}}
body.v3 #app{background:#fff}
body.v3 main{inset:0;padding:0;display:block;background:#fff;overflow:hidden}
.px{position:relative;height:100%;max-width:var(--col);margin:0 auto;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));
  font-family:var(--ui);color:var(--ink)}
.px button{font-family:inherit;-webkit-user-select:none;user-select:none}
.px img{-webkit-user-drag:none;user-select:none}
.px .fade{opacity:.42}

/* -- 2. top bar: ✕ · progress · Aa -- */
.px-top{flex:none;height:max(54px,calc(64 * var(--u)));display:flex;align-items:center;gap:12px}
.px-x{flex:none;width:44px;height:44px;margin-left:-8px;border-radius:12px;display:grid;place-items:center;font-size:24px;font-weight:700;color:#9aa3ad}
.px-x:hover{background:var(--surf)}
.px-prog{flex:1;height:12px;border-radius:7px;background:var(--line);overflow:hidden}
.px-prog i{display:block;height:100%;width:0;border-radius:7px;background:var(--blue);transition:width .45s ease}
.px-aa{flex:none;width:44px;height:44px;border-radius:12px;background:var(--surf);border:1.5px solid var(--line);font-weight:800;font-size:16px}
.px-aa.on{background:var(--blue-l);border-color:var(--blue);color:var(--blue-d)}

/* -- 3. body, Aa line, foot -- */
/* the body keeps a strip free at its bottom: the Aa line appears there, so nothing moves */
.px-body{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;padding-bottom:var(--aares)}
.px-main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:var(--g);padding-top:calc(20 * var(--u))}
.px-aaline{position:absolute;left:0;right:0;bottom:8px;z-index:7;background:var(--ink);color:#fff;border-radius:14px;padding:10px 16px;
  font:700 max(17px,calc(18 * var(--u)))/1.25 var(--read);text-align:center;text-wrap:balance;animation:pxUp .2s ease both}
.px-foot{flex:none;display:flex;flex-direction:column;align-items:center}
.px.has-btn .px-foot{padding:10px 0 max(16px,calc(22 * var(--u)))}
.px-note{flex:none;font-size:13px;line-height:1.35;color:var(--mute);text-align:center;max-width:46ch}
/* the first item shows, dimmed, while Kim reads the instruction */
.px-main,.px-foot{transition:opacity .4s ease,filter .4s ease}
.px.pre .px-main,.px.pre .px-foot{opacity:.5;filter:saturate(.6);pointer-events:none}
.px.sheet-open .px-body,.px.sheet-open .px-foot{pointer-events:none}

/* -- 4. shared pieces: buttons, speaker, chips, cards, pictures -- */
.px-btn{width:100%;height:max(52px,calc(56 * var(--u)));border-radius:16px;font-weight:800;font-size:max(17px,calc(18 * var(--u)));letter-spacing:.3px;
  display:flex;align-items:center;justify-content:center}
.px-btn.red{background:var(--red);color:#fff;box-shadow:0 3px 0 var(--red-d)}
.px-btn.green{background:var(--green);color:#fff;box-shadow:0 3px 0 var(--green-d)}
.px-btn:disabled{background:var(--surf);color:#aab2bb;box-shadow:none;cursor:default}
.px-btn:not(:disabled):active{transform:translateY(2px);box-shadow:none}
.px-spk{flex:none;display:grid;place-items:center;background:var(--blue);color:#fff;box-shadow:0 3px 0 var(--blue-d);border-radius:calc(22 * var(--u))}
.px-spk svg{width:46%;height:46%}
.px-spk:active{transform:translateY(2px);box-shadow:0 1px 0 var(--blue-d)}
.px-spk.xl{width:calc(124 * var(--u));height:calc(116 * var(--u))}
.px-spk.lg{width:calc(90 * var(--u));height:calc(84 * var(--u))}
.px-spk.md{width:max(56px,calc(76 * var(--u)));height:max(52px,calc(70 * var(--u)));border-radius:max(16px,calc(20 * var(--u)))}
.px-spk.sm{width:max(48px,calc(60 * var(--u)));height:max(46px,calc(56 * var(--u)));border-radius:16px}
.px-spk.xs{width:max(44px,calc(44 * var(--u)));height:max(44px,calc(44 * var(--u)));border-radius:12px}
.px-spk.green{background:var(--green);box-shadow:0 3px 0 var(--green-d)}
.px-spk.playing{animation:pxSpk 1s ease-in-out infinite}
.px-spk.green.playing{animation:pxSpkG 1s ease-in-out infinite}
.px-chip{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:calc(8 * var(--u)) calc(14 * var(--u));
  border:1.5px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 2px 0 var(--line);
  font:700 max(19px,calc(20 * var(--u)))/1.15 var(--read);color:var(--ink);white-space:nowrap;transition:transform .12s,background .2s,color .2s}
button.px-chip:active{transform:translateY(2px);box-shadow:none}
.px-chip.ghost{background:var(--surf);border-color:var(--surf);color:transparent;box-shadow:none;cursor:default}
.px-read{font-family:var(--read);font-weight:700}
.px-read u,.px-sent u,.px-word-chip u{text-decoration:none;color:var(--red-d);background:var(--red-l);border-radius:5px;padding:0 1px}
.px-sent{font:700 max(22px,calc(26 * var(--u)))/1.25 var(--read);color:var(--ink);text-wrap:balance}
.px-sent.q{color:var(--blue-d);text-align:center}
.px-say{flex:none;display:flex;align-items:center;justify-content:center;gap:calc(12 * var(--u));max-width:100%}
.px-card{position:relative;padding:0;border-radius:18px;border:1.5px solid var(--line);background:#fff;box-shadow:0 2px 0 var(--line);overflow:hidden;
  transition:opacity .25s,transform .12s}
.px-card > img{position:absolute;inset:8px;width:calc(100% - 16px);height:calc(100% - 16px);object-fit:contain}
.px-card.obj > img{inset:13%;width:74%;height:74%}
button.px-card:active{transform:translateY(2px)}
.px-card.ok{border:3px solid var(--green);background-color:var(--green-l)}
.px-wrong{animation:pxShake .45s ease;border-color:var(--red)!important;box-shadow:0 0 0 4px rgba(224,88,72,.25)!important}
.px-hint{animation:pxHint 1s ease-in-out infinite;box-shadow:0 0 0 5px rgba(242,179,61,.75)!important}
/* pictures: objects on a padded white card, scenes rounded as they are (never cropped, never stretched) */
.px-obj{position:relative;border-radius:18px;border:1.5px solid var(--line);background:#fff;box-shadow:0 2px 0 var(--line)}
.px-obj > img{position:absolute;inset:12%;width:76%;height:76%;object-fit:contain}
.px-scene{position:relative;line-height:0}
.px-scene > img{display:block;border-radius:18px;border:1.5px solid var(--line);box-shadow:0 2px 0 var(--line);background:#fff}
.px-pic{position:relative;flex:1;min-height:0;width:100%;container-type:size;display:grid;place-items:center}
.px-pic > .px-obj{width:min(100cqw,100cqh,calc(300 * var(--u)));aspect-ratio:1}
.px-pic > .px-scene > img{max-width:100cqw;max-height:100cqh;width:auto;height:auto}
.px-pics{display:flex;gap:calc(14 * var(--u));justify-content:center;align-items:center}
.px-pic > .px-pics > .px-obj{width:min(46cqw,100cqh,calc(220 * var(--u)));aspect-ratio:1}
.px-pic.has-spk .px-spk{position:absolute;top:8px;left:8px;z-index:2}
.px-head{flex:none;display:flex;flex-direction:column;align-items:center;gap:calc(14 * var(--u));width:100%}
.px-head.row{flex-direction:row;justify-content:center}
.px-head.grow{flex:1;min-height:0}

/* -- 5. option grids: cards share the free area, sized by its width AND height (container units) --
   3 options: two on top, one centred under them (P1, P2, P4); a row of three when the area is wide. */
.px-opts{flex:1;min-height:0;width:100%;container-type:size;container-name:opts;display:grid;place-items:center}
.px-grid{--cols:2;--rows:2;--ar:1;--cmax:260px;--gg:var(--g);display:grid;gap:var(--gg);justify-content:center;align-content:center;
  --cw:min(calc((100cqw - (var(--cols) - 1) * var(--gg)) / var(--cols)), calc((100cqh - (var(--rows) - 1) * var(--gg)) / var(--rows) * var(--ar)), var(--cmax));
  grid-template-columns:repeat(var(--cols),var(--cw))}
.px-grid > *{width:var(--cw);aspect-ratio:var(--ar)}
.px-grid[data-n="2"]{--cols:2;--rows:1}
.px-grid[data-n="3"],.px-grid[data-n="4"]{--cols:2;--rows:2}
.px-grid[data-n="5"],.px-grid[data-n="6"]{--cols:2;--rows:3}
.px-grid[data-n="3"] > :last-child,.px-grid[data-n="5"] > :last-child{grid-column:1 / -1;justify-self:center}
@container opts (min-aspect-ratio: 4 / 3){
  .px-grid[data-n="3"]{--cols:3;--rows:1}
  .px-grid[data-n="4"]{--cols:4;--rows:1}
  .px-grid[data-n="5"],.px-grid[data-n="6"]{--cols:3;--rows:2}
  .px-grid[data-n="3"] > :last-child,.px-grid[data-n="5"] > :last-child{grid-column:auto}
}
.px-grid.cards{--ar:.82;--cmax:calc(250 * var(--u) + 40px)}
.px-grid.cards.objs{--ar:1;--cmax:calc(200 * var(--u) + 30px)}
.px-grid.kids{--ar:1;--cmax:calc(180 * var(--u) + 30px);--gg:calc(14 * var(--u))}
.px-grid.round{--ar:1;--cmax:calc(150 * var(--u) + 40px);--gg:calc(30 * var(--u))}

/* -- 6. listen & tap: P1 bubbles · P2 pictures · P3 names -- */
.px-listen .px-main{padding-top:calc(44 * var(--u));gap:calc(46 * var(--u))}
.px-bub{position:relative;border-radius:50%;display:grid;place-items:center;transition:opacity .25s;
  background:radial-gradient(circle at 30% 28%,#fff 0 14%,rgba(255,255,255,0) 15%),radial-gradient(circle,#eef3ff 55%,#c7d5f7);
  box-shadow:inset 0 0 0 3px #b4c6f2;animation:pxBob 3.4s ease-in-out infinite}
.px-bub:nth-child(2){animation-delay:-1.1s}.px-bub:nth-child(3){animation-delay:-2.2s}
.px-bub img{width:60%;height:60%;object-fit:contain}
.px-bub.ok{background:radial-gradient(circle at 30% 28%,#fff 0 14%,rgba(255,255,255,0) 15%),radial-gradient(circle,#f1fbf3 55%,#bfe6c9);box-shadow:inset 0 0 0 4px var(--green),0 0 0 6px rgba(63,164,91,.18)}
.px-bub.px-wrong{box-shadow:inset 0 0 0 4px var(--red),0 0 0 6px rgba(224,88,72,.2)!important}
.px-names .px-main{padding-top:calc(24 * var(--u));gap:calc(28 * var(--u))}
.px-name{font-size:max(26px,calc(32 * var(--u)));padding:calc(10 * var(--u)) calc(24 * var(--u));min-width:calc(110 * var(--u));min-height:calc(66 * var(--u))}
.px-name:empty{visibility:hidden}
.px-card.kid > img{inset:6px;width:calc(100% - 12px);height:calc(100% - 12px)}
.px-card.named{border:3px solid var(--green);cursor:default}
.px-ktag{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:var(--green);color:#fff;border-radius:999px;padding:2px 12px;
  font:700 max(16px,calc(17 * var(--u)))/1.2 var(--read);white-space:nowrap;box-shadow:0 2px 0 var(--green-d)}
.px-ktag:empty{display:none}

/* -- 7. choose: word → pictures (P4) · picture + sentence → ✓ ✗ (P5) · picture → words / sentences · picture + sound → pictures -- */
.px-choose .px-main{padding-top:calc(24 * var(--u))}
.px-word-chip{font-size:max(34px,calc(42 * var(--u)));padding:calc(10 * var(--u)) calc(30 * var(--u));border-radius:16px}

  background:linear-gradient(to bottom,transparent calc(100% - 2px),var(--line) 0) 0 0 / 100% var(--row)}

/* -- 11. wide screens (laptop, iPad landscape): same design in a centred column; buttons don't stretch across -- */

  .px-sort .px-main,.px-spell .px-main,.px-main[data-lay="marks"]{justify-content:center}
  .px-speak .px-main{padding-top:calc(14 * var(--u));gap:calc(14 * var(--u))}

  .px-spellhead{flex-grow:1}

  .px-foot .px-btn,.px-sheet .px-btn{max-width:520px;align-self:center}
  .px-sheet-in{max-width:560px}
}

@media (orientation:portrait) and (min-width:700px){

  .px-opts.list{flex:1 1 0}
  .px-opts.list .px-list{max-width:420px}
  .px-listen .px-main,.px-names .px-main,/* a sound + ✓ ✗ only (no picture): the pair sits in the middle of the screen */
.px-main[data-lay="marks"]:not(:has(.px-pic)){justify-content:center;padding-bottom:calc(60 * var(--u));gap:calc(40 * var(--u))}
.px-main[data-lay="pics"]{padding-top:4px;gap:24px}
  .px-spk.xl{width:96px;height:90px}
  .px-word-chip{font-size:30px}
  .px-word-chip.long{font-size:24px;padding-left:16px;padding-right:16px}
  .px-sent{font-size:20px}
  .px.has-btn .px-foot{padding:6px 0 10px}
  .px-btn{height:48px}
  /* spell / build / gaptext / sort: picture left, the work right */
  .px-spell .px-main,.px-build .px-main,.px-gap .px-main,.px-sort .px-main{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);grid-auto-rows:auto;align-content:center;column-gap:24px;row-gap:10px}
  .px-spell .px-main > .px-head,.px-build .px-main > .px-head,.px-gap .px-main > .px-head,.px-sort .px-main > .px-head{grid-column:1;grid-row:1 / span 4;max-width:none;height:100%}
  .px-spell .px-main > :not(.px-head),.px-build .px-main > :not(.px-head),.px-gap .px-main > :not(.px-head),.px-sort .px-main > :not(.px-head){grid-column:2}
  .px-gap .px-ptext{font-size:18px;line-height:1.9}
  .px-gap .px-head .px-pic{display:none}
  .px-gap .px-main{grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr)}
  .px-tray{height:88px}
  .px-build .px-main{row-gap:6px}
  .px-lines{--row:52px}
  .px-lines .px-chip,.px-bank .px-chip{min-height:44px;height:44px;font-size:18px}
  .px-bank{gap:6px}
  /* speaking: the mic column sits right of the picture */
  .px.has-mic{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr)}
  .px.has-mic .px-top{grid-column:1 / -1}
  .px.has-mic .px-foot{grid-column:2;grid-row:2;justify-content:center;padding:0 0 calc(var(--aares) - 20px) 18px}
  .px-speak .px-main{flex-direction:row}
  .px-mic{width:72px;height:72px}
  .px-mline{max-width:200px}
}

@keyframes pxUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pxShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes pxHint{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes pxBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pxSpk{0%,100%{box-shadow:0 3px 0 var(--blue-d),0 0 0 0 rgba(74,111,214,.4)}50%{box-shadow:0 3px 0 var(--blue-d),0 0 0 10px rgba(74,111,214,0)}}
@keyframes pxSpkG{0%,100%{box-shadow:0 3px 0 var(--green-d),0 0 0 0 rgba(63,164,91,.4)}50%{box-shadow:0 3px 0 var(--green-d),0 0 0 8px rgba(63,164,91,0)}}
@keyframes pxRings{0%,100%{box-shadow:0 4px 0 var(--red-d),0 0 0 4px rgba(224,88,72,.25),0 0 0 10px rgba(224,88,72,.1)}50%{box-shadow:0 4px 0 var(--red-d),0 0 0 14px rgba(224,88,72,.25),0 0 0 30px rgba(224,88,72,.12)}}
@keyframes pxListen{0%,100%{box-shadow:0 4px 0 var(--red-d),0 0 0 0 rgba(224,88,72,.35)}50%{box-shadow:0 4px 0 var(--red-d),0 0 0 12px rgba(224,88,72,0)}}
@keyframes pxBulb{0%,100%{box-shadow:0 3px 0 #E2C55A,0 0 0 0 rgba(255,214,70,0)}50%{box-shadow:0 3px 0 #E2C55A,0 0 0 9px rgba(255,214,70,.35)}}
@media (prefers-reduced-motion: reduce){.px-sheet{transition:none}}
/* =====================================================================
   V3 STORY + NAVIGATION (2026-11-18, milestones 3–4) — decisions #53, #54, #56.
   Story: Watch (st-watch) · Explore vocab (st-explore) · one card per screen (st-cards) · recap · done.
   Navigation: splash · units (nv-units) · unit path + lesson roadmap (nv-road).
   Same design on every screen size; landscape screens only stretch it.
   ===================================================================== */
.px-btn.white{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:0 2px 0 var(--line)}
.hl{color:var(--blue-d);border-bottom:3px dashed var(--blue);padding-bottom:1px}
.hl.m{display:inline-block;animation:stMerge .6s cubic-bezier(.3,1.6,.5,1) both}
.q{color:var(--red-d)}
.kh{display:block;border-radius:50%;background:#F3EDFF center/cover no-repeat}

/* -- 1. scene screens: camera -- */
.st{position:absolute;inset:0;overflow:hidden;font-family:var(--ui);color:var(--ink);background:#fff}
.st-cam{position:absolute;inset:0;overflow:hidden;background:#F6F1E8}
.st-blur{position:absolute;inset:-60px;background:center/cover no-repeat;filter:blur(24px) saturate(.8) brightness(1.06);transform:scale(1.06)}
.st-wash{position:absolute;inset:0;background:rgba(255,253,248,.6)}
.st-canvas{position:absolute;overflow:hidden;container-type:size}
.st-cam[data-mode="fit"] .st-canvas{box-shadow:0 10px 36px rgba(36,41,56,.16)}
.st-canvas.anim{transition:left .7s cubic-bezier(.4,0,.2,1),top .7s cubic-bezier(.4,0,.2,1),width .7s cubic-bezier(.4,0,.2,1),height .7s cubic-bezier(.4,0,.2,1)}
.st-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .45s ease}
.st-img.out{opacity:0}
.st-layer{position:absolute;inset:0}
.st-dim{position:absolute;inset:0;background:rgba(255,253,248,.8);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.st-actor{position:absolute;height:auto;max-width:none;filter:drop-shadow(0 8px 8px rgba(36,41,56,.18));animation:stPop .4s ease both}
.st-bubble{position:absolute;max-width:30%;background:#fff;border:2.5px solid var(--ink);border-radius:20px 20px 20px 4px;padding:.3em .7em;
  font-size:clamp(14px,3.2cqw,30px);line-height:1.2;animation:stPop .35s ease both}
/* "look here": a ring exactly on the hotspot (box) or on a point (circle) */
.st-ring{position:absolute;pointer-events:none;border:4px solid #fff;border-radius:18px;animation:stRing 1.3s ease-in-out infinite}
.st-ring:not(.box){width:13cqw;height:13cqw;border-radius:50%;transform:translate(-50%,-50%)}

/* -- 2. watch: pill · map · menu on top; chips / board + caption at the bottom (foods stand on the scene: section 3) -- */
.st-top{position:absolute;z-index:5;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.st-sp{flex:1}
.st-pill{background:#fff;border-radius:22px;padding:9px 15px;font-weight:800;font-size:max(14px,calc(14 * var(--u)));box-shadow:0 2px 8px rgba(36,41,56,.16);white-space:nowrap}
.st-ib,.st-x{flex:none;width:max(44px,calc(44 * var(--u)));height:max(44px,calc(44 * var(--u)));border-radius:12px;background:#fff;display:grid;place-items:center;color:var(--ink);box-shadow:0 2px 8px rgba(36,41,56,.16)}
.st-ib svg{width:22px;height:22px}
.st-x{font-size:20px;font-weight:700;color:#8a949f}
.st-x.dark{box-shadow:none;background:var(--surf)}
/* left / right = the visible picture frame's edges (--bl / --br from frameColumn): the caption is exactly as wide as the frame */
.st-bottom{position:absolute;z-index:5;left:max(var(--bl,12px),env(safe-area-inset-left,0px));right:max(var(--br,12px),env(safe-area-inset-right,0px));bottom:0;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;
  padding:0 0 calc(env(safe-area-inset-bottom,0px) + 14px)}
.st-bottom.glide{transition:left .7s cubic-bezier(.4,0,.2,1),right .7s cubic-bezier(.4,0,.2,1)}
.st-bottom > *{pointer-events:auto;max-width:100%}
.st-cap{width:100%;display:flex;align-items:center;gap:12px;padding:10px;border-radius:22px;background:rgba(255,255,255,.97);box-shadow:0 6px 18px rgba(36,41,56,.2)}
.st-head{flex:none;width:max(58px,calc(62 * var(--u)));height:max(58px,calc(62 * var(--u)));border-radius:50%}
.st-head .kh,.st-cheer .kh{width:100%;height:100%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.st-head.talk .kh,.st-cheer.talk .kh{animation:stTalk .5s ease-in-out infinite alternate}
.st-head:active{transform:scale(.95)}
.st-txt{flex:1;min-width:0;font:700 max(19px,calc(21 * var(--u)))/1.3 var(--read);text-wrap:pretty}
.st-go{flex:none;width:max(54px,calc(58 * var(--u)));height:max(52px,calc(56 * var(--u)));border-radius:16px;background:var(--red);color:#fff;box-shadow:0 3px 0 var(--red-d);display:grid;place-items:center}
.st-go svg{width:26px;height:26px}
.st-go:active{transform:translateY(2px);box-shadow:none}
.st-go.pulse{animation:stGo 1.1s ease-in-out infinite}
.st-chips{display:flex;align-items:center;gap:8px;font:700 max(18px,calc(19 * var(--u)))/1 var(--read);animation:stPop .35s ease both}
.st-chips s{background:#fff;color:var(--mute);border-radius:10px;padding:6px 11px;box-shadow:0 2px 6px rgba(36,41,56,.14);text-decoration-thickness:2px}
.st-chips .ar{color:var(--ink);font-size:.8em;width:1.6em;height:1.6em;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 2px 6px rgba(36,41,56,.14)}
.st-chips b{background:var(--blue);color:#fff;border-radius:10px;padding:6px 11px;box-shadow:0 3px 0 var(--blue-d)}
.st-board{background:rgba(255,255,255,.97);border-radius:16px;padding:8px 16px;box-shadow:0 4px 14px rgba(36,41,56,.16);
  font:700 max(18px,calc(19 * var(--u)))/1.45 var(--read);text-align:center;text-wrap:balance}
.st-board.in{animation:stPop .35s ease both}

/* -- 3. explore vocab: thin word bar on top, the scene uncovered -- */
/* ✕ (and ‹ Food Street) on the left · the word bar centred on the screen · an empty cell as wide as the left one */
.st-etop{position:absolute;z-index:6;top:0;left:0;right:0;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:start;gap:8px;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px))}
.st-etop > *,.st-eleft > *{pointer-events:auto}
.st-eleft{display:contents}
.st-etop .st-x{grid-column:1;grid-row:1;justify-self:start}
.st-etop .st-wbar{grid-column:2;grid-row:1}
.st-etop .st-back{grid-column:1 / -1;grid-row:2;justify-self:start}
.st-wbar{min-height:44px;border-radius:16px;background:rgba(255,255,255,.96);box-shadow:0 2px 10px rgba(36,41,56,.16);padding:6px 10px 4px;text-align:right}
.st-wbar:active{transform:translateY(1px)}
.st-slots{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:3px;justify-items:center}
.st-slot{width:max(30px,calc(32 * var(--u)));height:max(30px,calc(32 * var(--u)));display:grid;place-items:center}
.st-slot:empty::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--line)}
.st-slot img{width:100%;height:100%;object-fit:contain}
.st-slot.pop{animation:stPop .4s cubic-bezier(.3,1.6,.5,1) both}
.st-count{display:block;font-size:12px;font-weight:800;color:var(--mute);line-height:1.2}
.st-fly{position:fixed;z-index:70;object-fit:contain;pointer-events:none;transform-origin:0 0}
.st-back{display:flex;align-items:center;gap:6px;height:44px;padding:0 16px 0 10px;border-radius:22px;background:#fff;box-shadow:0 2px 10px rgba(36,41,56,.16);font:700 16px var(--read)}
.st-back span{width:20px;height:20px;display:grid}
.st-back svg{width:20px;height:20px}
.st-hot{position:absolute;border-radius:18px;border:3px dashed rgba(255,255,255,.95);animation:stHot 1.8s ease-in-out infinite}
.st-hotname{position:absolute;transform:translate(-50%,calc(-100% - 6px));white-space:nowrap;background:#fff;border-radius:999px;padding:.2em .7em;pointer-events:none;
  font-size:clamp(12px,2.1cqw,20px);box-shadow:0 2px 6px rgba(36,41,56,.2)}
.st-hotname.visited::after{content:" ✓";color:var(--green)}
.st-hot.sel{border:4px solid #fff;animation:none;box-shadow:0 0 0 5px rgba(74,111,214,.6)}
.st-counter{position:absolute;left:6%;right:6%;bottom:4%;display:flex;justify-content:center;align-items:flex-end;gap:2.5%;container-type:inline-size}
.st-cfood{position:relative;width:20%;display:flex;flex-direction:column;align-items:center;gap:3px;animation:stPop .45s cubic-bezier(.3,1.6,.5,1) both}
.st-cfood img{width:100%;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(36,41,56,.25))}
.st-cfood .lbl{background:#fff;border-radius:999px;padding:.15em .6em;white-space:nowrap;font-size:clamp(12px,2.84cqw,24px);box-shadow:0 2px 6px rgba(36,41,56,.2)}
.st-cfood.heard .lbl{color:var(--blue-d)}
/* the ring frames the food AND its label (never cuts through the word) */
.st-cfood.sel::before{content:"";position:absolute;inset:-6% -8% -7%;border:4px solid #fff;border-radius:20px;box-shadow:0 0 0 5px rgba(74,111,214,.6);pointer-events:none}
/* Watch: the foods appear on the counter one by one as Kim names them; upright screens narrow the row to the cart */
.st-counter.watch .st-cfood.wait{visibility:hidden;animation:none}
.st-counter.watch .st-cfood.sel::before{inset:-5% -7% -6%}
.st-counter.tight{gap:2%}
/* a scene without a cart (I5's sky): the one word's picture + label stand on the part Kim looks at, no ring */
.st-counter.solo{bottom:7%}
.st-counter.solo .st-cfood{width:62%}
.st-counter.solo .st-cfood.sel::before{display:none}
.st-counter.solo .st-cfood .lbl{font-size:clamp(15px,9cqw,26px)}
.st-counter.tight .st-cfood{width:23%}
.st-counter.tight .st-cfood .lbl{font-size:clamp(13px,4.2cqw,22px);padding:.1em .45em}
.st-cfood.bounce img{animation:stBounce .5s ease}
.st-tray{position:absolute;z-index:5;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);max-width:560px;margin:0 auto}
.st-explore.all .st-tray{bottom:calc(env(safe-area-inset-bottom,0px) + 16px + max(52px,calc(56 * var(--u))) + 14px)}
.st-tray .st-counter{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.st-tray .st-counter[data-n="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.st-tray .st-cfood{width:auto;gap:4px;padding:10px 6px 10px;border-radius:18px;background:#fff;box-shadow:0 3px 12px rgba(36,41,56,.16)}
.st-tray .st-cfood img{width:auto;height:max(60px,calc(74 * var(--u)));filter:drop-shadow(0 4px 4px rgba(36,41,56,.18))}
.st-tray .st-cfood .lbl{box-shadow:none;padding:0;font-size:max(17px,calc(18 * var(--u)))}
.st-tray .st-cfood.sel::before{left:-3px;right:-3px;top:-3px;bottom:-3px;aspect-ratio:auto;border-radius:20px;border:0;box-shadow:0 0 0 4px rgba(74,111,214,.7)}
.st-ready{position:absolute;z-index:6;left:var(--bl,12px);right:var(--br,12px);margin:0 auto;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:min(380px,calc(100% - var(--bl,12px) - var(--br,12px) - 8px))}
.st-explore.glide .st-ready{transition:left .7s cubic-bezier(.4,0,.2,1),right .7s cubic-bezier(.4,0,.2,1)}
.st-ready.in{animation:stUp .35s ease both}
/* panel: every word (S3b) */
.st-panel{position:absolute;inset:0;z-index:20;background:rgba(36,41,56,.38);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;transition:opacity .2s;
  display:flex;justify-content:center;align-items:flex-end;padding:calc(env(safe-area-inset-top,0px) + 40px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px))}
.st-panel.show{opacity:1}
.st-sheet{width:100%;max-width:760px;max-height:100%;display:flex;flex-direction:column;background:#fff;border-radius:22px;box-shadow:0 10px 40px rgba(36,41,56,.3);
  transform:translateY(30px);transition:transform .25s ease}
.st-panel.show .st-sheet{transform:none}
.st-sh-head{flex:none;display:flex;align-items:center;gap:10px;padding:14px 14px 10px 18px}
.st-sh-head b{flex:1;font-size:max(19px,calc(20 * var(--u)));font-weight:800}
.st-sh-body{flex:1;min-height:0;overflow:auto;padding:2px 14px 14px}
.st-sh-foot{flex:none;padding:0 14px 14px}
.st-sh-foot:has(> [hidden]:only-child){display:none}
/* word tiles (panel + recap): picture · 🔊 word */
.st-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.st-tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border-radius:16px;border:1.5px solid var(--line);background:#fff;box-shadow:0 2px 0 var(--line);min-width:0}
.st-tile img{width:100%;height:max(58px,calc(64 * var(--u)));object-fit:contain}
.st-tile .t{display:flex;align-items:center;justify-content:center;gap:3px;max-width:100%;font-size:max(14px,calc(15.5 * var(--u)));line-height:1.15;text-align:center}
.st-tile i{flex:none;width:15px;height:15px;color:var(--blue);display:grid}
.st-tile i svg{width:100%;height:100%}
.st-tile.heard{border-color:var(--blue);background:var(--blue-l)}
.st-tile:active{transform:translateY(2px);box-shadow:none}
.st-tile.bounce img{animation:stBounce .5s ease}
@media (min-width:600px){.st-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}}

/* -- 4. one card per screen (S4 · S5), summary (S6), recap (F3) -- */
.st-cards,.st-recap{display:flex;flex-direction:column;max-width:var(--col);margin:0 auto;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.st-cbody{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:calc(14 * var(--u))}
/* one column: the card is exactly as wide as its picture, so the sentence row shares the picture's edges.
   A one-line sentence (S4) is centred under the picture; question + answer (S5) start at the picture's left edge. */
.st-card{flex:1;min-height:0;width:100%;max-width:calc(560 * var(--u));margin:0 auto;display:flex;flex-direction:column;justify-content:safe center;gap:calc(22 * var(--u))}
.st-card > .st-pic{flex:1 1 auto;min-height:120px;width:100%;max-height:calc(380 * var(--u) + 60px)}
.st-pic{position:relative;overflow:hidden;border-radius:20px;border:1.5px solid var(--line);background:#fff;box-shadow:0 2px 0 var(--line)}
.st-pic > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.st-pic.obj > img:first-child{inset:6%;width:88%;height:88%;object-fit:contain}
.st-pic .st-cfoodimg{position:absolute;left:50%;top:62%;width:24%;transform:translate(-50%,-50%);object-fit:contain}
.st-pic.obj > img[src*="i-hand"]:first-child{inset:5% 16% 44%;height:51%;width:68%}
.st-pic.obj > img[src*="i-hand"] ~ .st-cfoodimg{top:76%;width:auto;height:38%}
.st-lines{flex:none;display:flex;flex-direction:column;gap:calc(14 * var(--u))}
.st-line{display:flex;align-items:center;gap:14px}
.st-cards:not(.qa) .st-line{justify-content:center}
.st-line.ans{opacity:.18;transition:opacity .3s}
.st-line.ans.in{opacity:1}
.st-sent{font-size:max(22px,calc(27 * var(--u)));line-height:1.3}
.st-cfoot{flex:none;display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px 0 calc(env(safe-area-inset-bottom,0px) + max(16px,calc(22 * var(--u))))}
.st-cfoot .px-btn{max-width:520px}
.st-cfoot.two{gap:12px}
.st-dots{display:flex;gap:8px;justify-content:center}
.st-dots i{width:10px;height:10px;border-radius:5px;background:var(--line);transition:width .25s,background .25s}
.st-dots i.on{width:28px;background:var(--blue)}
.st-dots i.past{background:#B9C7EE}
.st-sum{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;justify-content:safe center;padding:4px 2px}
.st-row{flex:none;display:flex;align-items:center;gap:16px;padding:0;border-radius:18px;border:1.5px solid var(--line);background:#fff;box-shadow:0 2px 0 var(--line);overflow:hidden;text-align:left;
  height:max(96px,calc(150 * var(--u)))}
.st-row .st-pic{flex:none;height:100%;aspect-ratio:1;border:0;border-radius:0;box-shadow:none;border-right:1.5px solid var(--line)}
.st-rtext{display:flex;flex-direction:column;gap:4px;font-size:max(20px,calc(23 * var(--u)));line-height:1.35;padding-right:10px}
.st-rtext small{font-size:.72em}
.st-row.playing{border-color:var(--blue);box-shadow:0 0 0 3px rgba(74,111,214,.25)}
.st-h{flex:none;margin:calc(6 * var(--u)) 0 calc(14 * var(--u));font-size:max(22px,calc(24 * var(--u)));font-weight:800}
.st-gridwrap{flex:1;min-height:0;overflow:auto;padding:2px 2px 8px}

/* -- 5. done (F4 without the stamp): Kim's head cheering · title · results -- */
.st-done{display:flex;flex-direction:column;background:none}
.st-done .nv-bg{z-index:0}
.st-dmain{position:relative;z-index:1;flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:calc(16 * var(--u));
  padding:calc(env(safe-area-inset-top,0px) + 24px) 16px 8px;text-align:center}

/* =====================================================================
   V3 REWARDS (2026-11-18, milestone 6) — decision #57. Mockup: tools/design-v3/v3k.html section E (F4, R1, R2, R3).
   Stage stamps (ink by result: blue / silver / gold) · pick a reward (R1) · my street (R2) · passport cover (R3).
   Passport paper = cream #FBF4E4 with #E6D9BC lines; red = the child acts, blue = listen, gold = earned.
   ===================================================================== */
.ink-blue{--ink:#3756B5;--wash:rgba(74,111,214,.10)}
.ink-silver{--ink:#7A8696;--wash:rgba(150,160,172,.17)}
.ink-gold{--ink:#C98B12;--wash:rgba(242,179,61,.18)}
/* -- 1. a stage stamp: dashed ink ring · milestone picture · label -- */
.rw-stamp{position:relative;flex:none;display:block;width:var(--sz,96px);height:var(--sz,96px);padding:0;border-radius:50%;
  transform:rotate(var(--rot,0deg));font-family:var(--ui)}
.rw-stamp .ring{position:absolute;inset:0;border-radius:50%;border:3px dashed var(--ink);background:var(--wash)}
.rw-stamp .ring::after{content:"";position:absolute;inset:4px;border-radius:50%;border:1.5px solid var(--ink);opacity:.5}
.rw-stamp .pic{position:absolute;inset:14%;border-radius:50%;background:#fff center/cover no-repeat;box-shadow:inset 0 0 0 2px var(--ink);filter:saturate(.92)}
.rw-stamp .pic::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--ink);opacity:.1;mix-blend-mode:multiply}
.rw-stamp .lab{position:absolute;left:50%;bottom:-7%;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:#fff;font-weight:800;
  font-size:max(10px,calc(var(--sz,96px) * .105));letter-spacing:.4px;line-height:1;padding:.34em .5em;border-radius:6px;box-shadow:0 2px 0 rgba(36,41,56,.15)}
.rw-stamp.ink-gold .ring{border-width:4px;box-shadow:0 0 0 5px rgba(242,179,61,.24)}
