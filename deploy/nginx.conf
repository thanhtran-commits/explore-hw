server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # every text file is UTF-8 (Vietnamese text + emoji in the JS packs)
  charset utf-8;
  charset_types text/css application/javascript text/javascript application/json text/plain;
  # pictures and audio never change under the same name (new versions get new folders) → cache long
  location /assets/ { expires 30d; add_header Cache-Control "public, max-age=2592000, immutable"; try_files $uri =404; }
  # app code and lesson packs: always re-check so updates show up at once
  # (add_header inside a location drops the server-level ones, so the mic policy is repeated here)
  location ~* \.(js|html)$ { add_header Cache-Control "no-cache"; add_header Permissions-Policy "microphone=(self)" always; try_files $uri =404; }
  location / { try_files $uri /index.html; }
  # the speaking exercises need the microphone on this site
  add_header Permissions-Policy "microphone=(self)" always;
  gzip on; gzip_types text/css application/javascript text/javascript application/json;
}
